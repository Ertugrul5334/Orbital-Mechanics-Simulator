[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-sim"
version = "1.0.0"
description = "Two-body and perturbed orbit propagation, orbital manoeuvres, mission planning and reaction-wheel attitude control."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["orbital_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
